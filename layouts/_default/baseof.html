<!DOCTYPE html>
<html lang="id">
<head>
  {{ partial "head.html" . }}
</head>
<body class="site-body">
  <div id="reading-progress" class="reading-progress-bar"></div>
  
  {{ partial "header.html" . }}

  <main id="main-content" class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}

  <div id="toast" class="toast-notification" aria-live="polite"></div>

  <script>
    // Copy link helper
    function copyArticleLink(btn) {
      navigator.clipboard.writeText(window.location.href).then(() => {
        showToast("Tautan artikel berhasil disalin!");
      }).catch(() => {
        showToast("Gagal menyalin tautan");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.add("visible");
      setTimeout(() => {
        toast.classList.remove("visible");
      }, 3000);
    }

    // Reading progress bar for single article
    window.addEventListener("scroll", () => {
      const bar = document.getElementById("reading-progress");
      if (!bar) return;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      if (docHeight <= 0) return;
      const progress = (window.scrollY / docHeight) * 100;
      bar.style.width = Math.min(progress, 100) + "%";
    });
  </script>
</body>
</html>
